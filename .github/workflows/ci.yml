name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/agentfence.mjs test --presets

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate plugin and marketplace manifests
        run: npx -y @anthropic-ai/claude-code plugin validate .
      - name: Hook smoke test
        run: |
          out=$(echo '{"tool_name":"Bash","tool_input":{"command":"git push --force"},"cwd":"/tmp"}' | CLAUDE_PLUGIN_ROOT=$PWD bash -c "$(jq -r '.hooks.PreToolUse[0].hooks[0].command' hooks/hooks.json)")
          echo "$out"
          echo "$out" | jq -e '.hookSpecificOutput.permissionDecision == "deny"'
